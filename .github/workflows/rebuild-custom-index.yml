name: Rebuild custom preset index

on:
  push:
    branches:
      - aos-2026.6-ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Rebuild preset index
        run: |
          node indexer/indexer.js
          node indexer/check.js

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index_hash.txt
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Rebuild preset index for 2026.6"
            git push
          fi
