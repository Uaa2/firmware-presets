name: Complete RC Link 2026.6 compatibility

on:
  push:
    branches:
      - aos-2026.6-ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add 2026.6 metadata to all 2025.12 RC Link presets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('presets/2025.12/rc_link')
          changed = []
          for p in sorted(root.rglob('*.txt')):
              text = p.read_text()
              marker = '#$ FIRMWARE_VERSION: 2025.12\n'
              addition = '#$ FIRMWARE_VERSION: 2026.6\n'
              if marker in text and addition not in text:
                  text = text.replace(marker, marker + addition, 1)
                  p.write_text(text)
                  changed.append(str(p))

          # Match the small description cleanup from PR #585 for the two 1000Hz generic presets.
          replacements = {
              root / 'generic/1000hz_freestyle.txt': ('Best used with 2025.12.', 'Best used with 2026.6.'),
              root / 'generic/1000hz_race.txt': ('Best used with 2025.12.', 'Best used with 2026.6.'),
          }
          for p, (old, new) in replacements.items():
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
                  changed.append(str(p))

          print('Updated files:')
          for f in sorted(set(changed)):
              print(f)
          PY

      - name: Rebuild and validate preset index
        run: |
          node indexer/indexer.js
          node indexer/check.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presets/2025.12/rc_link index.json index_hash.txt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Complete 2026.6 RC Link compatibility"
            git push
          fi
